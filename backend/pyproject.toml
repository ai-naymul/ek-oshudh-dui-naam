[project]
name = "ek-oshudh-backend"
version = "0.1.0"
description = "Ek Oshudh, Dui Naam: catalog-constrained medicine checking for Bangladeshi prescriptions and medicine bags"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.5",
    "jellyfish>=1.3.0",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
